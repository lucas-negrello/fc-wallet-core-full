x-balances-env: &balances-env
  APP_ENV: local
  APP_DEBUG: 'true'
  APP_KEY: "base64:UPwQ1GlDr7TbnOVEj3DnCf59DYXfBv35Dg/UtX3qFjI="
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: balances-mysql
  DB_PORT: "3306"
  DB_DATABASE: balances
  DB_USERNAME: root
  DB_PASSWORD: root
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_GROUP_ID: balances-service
  KAFKA_TOPIC_BALANCES: balances
  KAFKA_TOPIC_TRANSACTIONS: transactions

services:

  zookeeper:
    image: "confluentinc/cp-zookeeper:6.1.0"
    container_name: zookeeper
    ports:
      - 2181:2181
    environment:
      TZ: America/Sao_Paulo
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: "confluentinc/cp-enterprise-kafka:6.1.0"
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      TZ: America/Sao_Paulo
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      CONFLUENT_METRICS_ENABLE: 'false'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-setup:
    image: confluentinc/cp-kafka:6.1.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
        bash -c "
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1 &&
            kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic balances     --partitions 1 --replication-factor 1 &&
            echo 'Kafka topics transactions and balances ready'
        "
    restart: "no"

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.3.0
    container_name: control-center
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  wallet-mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: wallet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet
    ports:
      - "3306:3306"
    volumes:
      - wallet_mysql_data:/var/lib/mysql
      - ./wallet-core/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wallet-core:
    build: ./wallet-core
    container_name: wallet-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: wallet-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: wallet
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: wallet
      WEB_SERVER_PORT: ":8080"
    depends_on:
      wallet-mysql:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  balances-mysql:
    image: mysql:8.0
    container_name: balances-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: balances
    ports:
      - "3307:3306"
    volumes:
      - balances_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  balances-migrate:
    build: ./balances-service
    image: balances-service:latest
    container_name: balances-migrate
    command: php artisan migrate --force --seed
    environment: *balances-env
    depends_on:
      balances-mysql:
        condition: service_healthy
    restart: "no"

  balances-api:
    build: ./balances-service
    image: balances-service:latest
    container_name: balances-api
    ports:
      - "3003:3003"
    environment: *balances-env
    depends_on:
      balances-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  balances-consumer:
    build: ./balances-service
    image: balances-service:latest
    container_name: balances-consumer
    command: php artisan kafka:consume
    environment: *balances-env
    depends_on:
      balances-migrate:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  wallet_mysql_data:
  balances_mysql_data:
